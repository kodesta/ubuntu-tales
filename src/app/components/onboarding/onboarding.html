<div class="onboarding-container">
  <!-- Top Bar / Header -->
  <header class="onboarding-header">
    <h1 class="brand-title">Ubuntu Tales</h1>
  </header>

  <!-- Main Hero Message -->
  <main class="onboarding-content">
    <div class="hero-text-block">
      <span class="sub-lead">Connect your spirit</span>
      <h2 class="main-heading">
        Bring more<br>
        <span class="highlight-text">Stories</span> Home
      </h2>
      <p class="summary-text">
        200+ Stories are waiting to bring them<br>
        connect to bring them home.
      </p>
    </div>

    <!-- Join the Tribe Button -->
    <div class="cta-section">
      <button class="join-btn" (click)="onJoinTribe()">
        Join the tribe
      </button>
      <button class="skip-btn" (click)="onSkip()">
        Maybe Later
      </button>
    </div>

    <!-- Feature Stats / Highlights -->
    <div class="stats-row">
      <div class="stat-item">
        <span class="stat-label">GLOBAL VOICES</span>
        <strong class="stat-value">Customs</strong>
      </div>
      <div class="stat-divider"></div>
      <div class="stat-item">
        <span class="stat-label">AUDIO EXPERIENCE</span>
        <strong class="stat-value">Spatial Audio</strong>
      </div>
    </div>

    <!-- Organic Framed Ancestor Illustration -->
    <div class="illustration-wrapper">
      <div class="organic-frame">
        <img src="assets/images/onboarding_warrior.jpg" alt="Spirit Ancestor Warrior" class="spirit-img">
      </div>
    </div>
  </main>
</div>
