global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ubuntu-tales-api
    metrics_path: /metrics
    static_configs:
      - targets: ['api:9464']
        labels:
          service: api
          env: production

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: postgres

  - job_name: caddy
    static_configs:
      - targets: ['caddy:2019']
        labels:
          service: edge
