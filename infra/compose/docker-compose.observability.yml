name: ubuntu-tales-observability

# Observability sidecar stack (production plan 07 §7). Run with:
#   docker compose -f infra/compose/docker-compose.observability.yml up -d

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ut-prometheus:/prometheus
    ports:
      - '9090:9090'

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ../observability/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../observability/grafana-provisioning.yml:/etc/grafana/provisioning/dashboards/default.yml:ro
      - ut-grafana:/var/lib/grafana
    ports:
      - '3002:3000'

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - '3100:3100'

  tempo:
    image: grafana/tempo:2.6.0
    restart: unless-stopped
    command: -config.file=/etc/tempo.yml
    volumes:
      - ../observability/tempo.yml:/etc/tempo.yml:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    restart: unless-stopped
    volumes:
      - ../observability/otel-collector.yml:/etc/otelcol/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '9464:9464'

volumes:
  ut-prometheus:
  ut-grafana:
